<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url=outputs/phase5/web_toolkit/">
    <title>Benchmark Coverage Gap Toolkit</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f7f4;
        --surface: #ffffff;
        --text: #1f2520;
        --muted: #646b66;
        --line: #d7dbd2;
        --accent: #335c67;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      main {
        width: min(680px, 100%);
        padding: 32px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--surface);
      }

      p {
        color: var(--muted);
      }

      a {
        color: var(--accent);
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Opening the Benchmark Coverage Gap Toolkit</h1>
      <p>
        You should be redirected automatically to the interactive Phase 5
        assessment toolkit.
      </p>
      <p>
        If the redirect does not work,
        <a href="outputs/phase5/web_toolkit/">open the toolkit manually</a>.
      </p>
    </main>
  </body>
</html>
